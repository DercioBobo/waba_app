[project]
name = "waba_app"
authors = [
    { name = "Dércio Bobo", email = "derciobob@gmail.com" }
]
description = "WhatsApp Business Cloud API + WhatsApp Flows for Frappe/ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.bench.dev-dependencies]
